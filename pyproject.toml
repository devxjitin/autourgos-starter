[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autourgos-starter"
version = "1.0.6"
description = "Beginner-friendly starter bundle for the Autourgos framework — one install, one function, a working agent"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jitin Kumar Sengar", email = "devxjitin@gmail.com" },
]
maintainers = [
    {name = "Sonia"},
    {name = "Vishwanil Suman"},
]
keywords = [
    "autourgos", "starter", "quickstart", "react", "agent",
    "openai", "llm", "ai", "tool-calling", "autonomous",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "autourgos-agent>=3.0.0",
    "autourgos-openaichat>=2.3.1",
    "autourgos-buffer-memory>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "build",
    "twine",
]

[project.urls]
Homepage   = "https://github.com/devxjitin/autourgos-starter"
Repository = "https://github.com/devxjitin/autourgos-starter"
Issues     = "https://github.com/devxjitin/autourgos-starter/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["autourgos_starter*"]

[tool.setuptools.package-data]
autourgos_starter = ["py.typed"]
